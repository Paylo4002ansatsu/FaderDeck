name: Build FaderDeck installers

on:
  push:
    branches:
      - main
    # Tags numéricas, sem prefixo v (por exemplo: 1.0.2).
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faderdeck-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            artifact: FaderDeck-Windows-x64
          - platform: macOS universal
            runner: macos-latest
            artifact: FaderDeck-macOS-universal
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for bridge archive
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build universal macOS DMG and ZIP
        if: runner.os == 'macOS'
        run: npm run dist:universal

      - name: Package standalone bridge
        if: runner.os == 'Windows'
        run: npm run package:bridge

      - name: Upload Windows installer and bridge
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            client/downloads/fader-bridge.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS universal installers
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FaderDeck-*
          path: release-assets
          merge-multiple: true

      - name: Publish installers to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
