name: Build FaderDeck installers

on:
  push:
    branches:
      - main
    # Tags numéricas, sem prefixo v (por exemplo: 1.0.2).
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag numérica existente a reconstruir e publicar (opcional)
        required: false
        type: string
      artifact_run_id:
        description: ID da execução que contém artifacts Windows e macOS válidos (opcional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: faderdeck-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ inputs.artifact_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            artifact: FaderDeck-Windows-x64
            kind: windows
          - platform: macOS universal
            runner: macos-latest
            artifact: FaderDeck-macOS-universal
            kind: macos
          - platform: macOS Monterey Intel
            runner: macos-latest
            artifact: FaderDeck-macOS-Monterey-Intel
            kind: monterey
    runs-on: ${{ matrix.runner }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for bridge archive
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "const v=require('./package.json').version; if (v !== process.env.RELEASE_TAG) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match package.json version ' + v); process.exit(1); }"

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Build Windows installer
        if: matrix.kind == 'windows'
        run: npm run dist:win -- --publish never

      - name: Build universal macOS DMG and ZIP
        if: matrix.kind == 'macos'
        run: npm run dist:universal -- --publish never

      - name: Build macOS Monterey Intel DMG and ZIP
        if: matrix.kind == 'monterey'
        run: >-
          npx electron-builder --mac dmg zip --x64 --publish never
          --config.electronVersion=43.8.12
          --config.mac.minimumSystemVersion=12.0.0
          '--config.mac.artifactName=FaderDeck-Mac-Monterey-Intel.${ext}'

      - name: Package standalone bridge
        if: matrix.kind == 'windows'
        run: npm run package:bridge

      - name: Upload Windows installer and bridge
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            client/downloads/fader-bridge.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS universal installers
        if: matrix.kind == 'macos' || matrix.kind == 'monterey'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: |
      always() &&
      (
        (startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success') ||
        (inputs.release_tag != '' && (inputs.artifact_run_id != '' || needs.build.result == 'success'))
      )
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FaderDeck-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Flatten files from build artifacts
        run: |
          find release-assets -mindepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec mv -n {} release-assets/ \;

      - name: Verify all installers are present
        run: |
          test -s release-assets/FaderDeck-Windows-Setup.exe
          test -s release-assets/FaderDeck-Mac.dmg
          test -s release-assets/FaderDeck-Mac.zip
          test -s release-assets/FaderDeck-Mac-Monterey-Intel.dmg
          test -s release-assets/FaderDeck-Mac-Monterey-Intel.zip
          test -s release-assets/fader-bridge.zip

      - name: Publish installers to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip

  update-site-download:
    name: Update website download version
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Windows download links from release tag
        run: npm run update:site-download-version -- "${{ inputs.release_tag || github.ref_name }}"

      - name: Commit website links to main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/app.js docs/README.md
          if git diff --cached --quiet; then
            echo "Website links already match ${RELEASE_TAG}."
            exit 0
          fi
          git commit -m "Update Windows download link to ${RELEASE_TAG}"
          git push origin HEAD:main

      - name: Rebuild GitHub Pages from latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
